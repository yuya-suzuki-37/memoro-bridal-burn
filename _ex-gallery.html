<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>種目ビジュアルQA</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="redesign.css?v=2">
<link rel="stylesheet" href="fatburn.css?v=4">
<style>
  body.lx{ background:var(--lx-cream)!important; padding:24px 16px 60px; }
  .g{ max-width:600px; margin:0 auto; display:grid; gap:30px; }
  .g h1{ font-family:var(--lx-serif); font-weight:600; text-align:center; color:var(--lx-ink); font-size:20px; margin:0 0 6px; }
  .g .cap{ font-family:var(--lx-serif); font-size:15px; color:var(--lx-ink); margin:10px 0 4px; }
</style>
</head>
<body class="lx">
<div class="g">
  <h1>種目ビジュアル 第1バッチ（QA）</h1>
  <div id="list"></div>
</div>
<script type="module">
import { EX_VISUALS } from './ex-visuals.js?v=1';
const NAME = { pt_squat_basic:'ベーシックスクワット', pt_sumo_squat:'スモウスクワット', pt_reverse_lunge:'リバースランジ', pt_glute_bridge:'グルートブリッジ', pt_plank:'プランク', pt_dead_bug:'デッドバグ', cd_march:'その場マーチング', cd_skater:'スケーター' };
const list = document.getElementById('list');
for (const [id, v] of Object.entries(EX_VISUALS)) {
  const d = document.createElement('div');
  d.style.marginBottom = '30px';
  d.innerHTML = `<p class="cap">${NAME[id]||id}</p><div class="bm-ex bm-ex-rich"><div class="ex-vis"><img src="${v.img}" loading="eager" alt=""><svg class="ex-vis-ovl" viewBox="${v.vb}" preserveAspectRatio="none">${v.overlay}</svg></div></div>`;
  list.appendChild(d);
}
</script>
</body>
</html>
